            <input
              id="history-search"
              type="search"
              autofocus
              placeholder="Search titles, addresses, and page text"
              aria-label="Search screenshots by title, address, or the text on the page"
            />
            <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>
              <svg class="icon" data-icon="x" viewBox="0 0 24 24" aria-hidden="true" focusable="false"></svg>
            </button>
            <kbd class="kbd" id="search-hotkey" aria-hidden="true">
              <svg class="icon" data-icon="command" id="hotkey-command" viewBox="0 0 24 24" hidden></svg>
              <span id="hotkey-modifier" hidden>Ctrl</span>
              <span>K</span>
            </kbd>
          </span>
          <button id="delete-selected" class="btn danger" type="button" disabled><svg class="icon" data-icon="trash" viewBox="0 0 24 24" aria-hidden="true" focusable="false"></svg><span class="button-label">Delete selected</span></button>
          <button id="theme" class="ghost only-icon" type="button">
            <svg class="icon" data-icon="device-desktop" data-theme-icon="system" viewBox="0 0 24 24" aria-hidden="true" focusable="false"></svg>
            <svg class="icon" data-icon="sun" data-theme-icon="light" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden></svg>
            <svg class="icon" data-icon="moon" data-theme-icon="dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden></svg>
          </button>
        </div>

          <p class="result-copy" id="result-copy"></p>

            <span>Sort</span>
            <select id="history-sort">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="largest">Largest first</option>
              <option value="title">Title A–Z</option>
            </select>
          </label>
        </div>

        <div id="select-all-row" class="selectall" hidden>
          <label>
            <input id="select-all" type="checkbox" />
            <span id="select-all-label">Select all</span>
          </label>
        </div>

        <div id="history-empty" class="empty" hidden>
          <b id="history-empty-title"></b>
          <span id="history-empty-body"></span>
        </div>
        <ul id="history-list" class="rows"></ul>
